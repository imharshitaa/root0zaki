<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Study — harshitaa</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #09070D;
      --bg2:       #160D20;
      --surface:   #1C1425;
      --border:    rgba(139,92,246,0.18);
      --border-hi: rgba(139,92,246,0.45);
      --purple:    #8B5CF6;
      --lavender:  #B18CFF;
      --pink:      #FF4FA3;
      --softpink:  #F5B8D2;
      --text:      #EDE7F6;
      --muted:     #93889F;
      --mono:      "Share Tech Mono", monospace;
      --sans:      "Space Grotesk", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--text);
      overflow-x: hidden; min-height: 100vh;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px; opacity: 0.35;
    }
    .site-wrap {
      position: relative; z-index: 1;
      width: min(860px, 94vw); margin: 0 auto; padding-bottom: 80px;
    }

    /* NAV */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 0 0; gap: 24px;
    }
    .nav-id { font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: 0.08em; }
    .nav-id span { color: var(--purple); }
    .nav-back {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; text-decoration: none; color: var(--muted);
      border: 1px solid var(--border); padding: 6px 14px; border-radius: 4px;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-back:hover { color: var(--lavender); border-color: var(--lavender); }

    /* HEADER */
    .doc-header {
      padding: 48px 0 36px; border-bottom: 1px solid var(--border); margin-bottom: 48px;
    }
    .doc-eyebrow {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--pink); margin-bottom: 12px;
    }
    #doc-title {
      font-family: var(--mono); font-size: clamp(24px, 4vw, 40px);
      font-weight: 400; color: var(--text); letter-spacing: -0.02em;
    }
    #doc-title .acc { color: var(--purple); }

    /* CONTENT */
    #content { font-size: 15px; line-height: 1.8; color: #C4BBD4; }
    #content h1, #content h2, #content h3, #content h4 {
      font-family: var(--mono); color: var(--lavender);
      letter-spacing: 0.02em; margin: 32px 0 12px;
    }
    #content h1 { font-size: 26px; }
    #content h2 { font-size: 20px; }
    #content h3 { font-size: 16px; color: var(--softpink); }
    #content h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
    #content p { margin-bottom: 16px; }
    #content ul, #content ol { padding-left: 20px; margin-bottom: 16px; color: var(--muted); }
    #content li { padding: 3px 0; line-height: 1.7; }
    #content strong { color: var(--text); font-weight: 600; }
    #content a { color: var(--lavender); }
    #content a:hover { text-decoration: underline; }
    #content hr {
      border: none; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-hi), transparent);
      margin: 32px 0;
    }
    #content blockquote {
      border-left: 2px solid var(--purple); padding-left: 16px; color: var(--muted); margin: 20px 0;
    }
    #content code {
      font-family: var(--mono); font-size: 13px;
      background: var(--bg2); border: 1px solid var(--border);
      padding: 1px 6px; color: var(--softpink);
    }
    #content pre {
      background: var(--bg2); border: 1px solid var(--border);
      padding: 16px 20px; overflow-x: auto; margin: 20px 0;
    }
    #content pre code {
      background: none; border: none; padding: 0;
      color: var(--muted); font-size: 12px; line-height: 1.6;
    }
    #content table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px; }
    #content th {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--purple);
      border-bottom: 1px solid var(--border-hi); padding: 8px 12px; text-align: left;
    }
    #content td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--muted); }
    #content img { max-width: 100%; display: block; margin: 24px 0; border: 1px solid var(--border); }

    /* DOC FOOTER */
    .doc-footer {
      margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px;
    }
    .footer-id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .footer-id .acc { color: var(--purple); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
<div class="site-wrap">

  <nav aria-label="Main navigation">
    <div class="nav-id"><span>harshitaa</span>@security:~/case-studies$</div>
    <a href="index.html" class="nav-back">← Case Studies</a>
  </nav>

  <header class="doc-header">
    <div class="doc-eyebrow">// case study</div>
    <h1 id="doc-title">Loading<span class="acc">_</span></h1>
  </header>

  <main id="content" aria-label="Case study content">
    <p style="font-family:var(--mono);font-size:13px;color:var(--muted);">loading…</p>
  </main>

  <footer class="doc-footer" role="contentinfo">
    <div class="footer-id"><span class="acc">harshitaa</span>@security:~/case-studies$</div>
    <a href="index.html" style="font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--border);padding:6px 14px;transition:color 0.2s,border-color 0.2s;" onmouseover="this.style.color='var(--lavender)';this.style.borderColor='var(--lavender)'" onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">← back to cases</a>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
<script>
(function() {
  const params   = new URLSearchParams(window.location.search);
  const file     = params.get("file");
  const titleEl  = document.getElementById("doc-title");
  const contentEl = document.getElementById("content");

  function toLabel(val) {
    if (!val) return "Case Study";
    return val.split("/").pop().replace(/\.[^/.]+$/, "")
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, m => m.toUpperCase());
  }

  if (!file) {
    titleEl.textContent = "No case study selected";
    contentEl.innerHTML = '<p style="font-family:var(--mono);font-size:13px;color:#FF6B6B;">No case study file specified.</p>';
    return;
  }

  const label = toLabel(file);
  titleEl.innerHTML = label + '<span class="acc">_</span>';
  document.title = label + " — harshitaa";

  const converter = new showdown.Converter({
    ghCodeBlocks: true, tables: true, strikethrough: true, openLinksInNewWindow: true
  });

  fetch(file)
    .then(r => r.text())
    .then(md => { contentEl.innerHTML = converter.makeHtml(md); })
    .catch(() => {
      contentEl.innerHTML = '<p style="font-family:var(--mono);font-size:13px;color:#FF6B6B;">Error loading case study.</p>';
    });
})();
</script>
</body>
</html>
